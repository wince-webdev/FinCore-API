# =====================================================================
# FinCore API — configuration commune à tous les profils
# Format YAML choisi pour la lisibilité (équivalent d'un config/packages
# Symfony : une arborescence = un objet de configuration).
# =====================================================================
spring:
  application:
    name: FinCore

  # Charge le fichier local `.env` (ignoré par Git) comme source de
  # propriétés : FINCORE_JWT_SECRET, FINCORE_DB_*, POSTGRES_*.
  # `optional:` = pas d'échec si le fichier est absent (CI, prod avec
  # vraies variables d'environnement). Format KEY=value compatible
  # Java properties.
  config:
    import: optional:file:.env[.properties]

  # Profil actif par défaut : dev. On le surcharge avec
  # `--spring.profiles.active=prod` ou SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev

  # --- Base de données ---
  # Les valeurs par défaut correspondent au docker-compose.yml local.
  # En production, tout est surchargé par variables d'environnement.
  datasource:
    # Port 5433 : le 5432 est occupé par le PostgreSQL de Laragon sur
    # cette machine (localhost → 127.0.0.1 → mauvais serveur, rôle
    # "fincore" introuvable). Voir docs/GUIDE_DETAILLE.md, piège P0-3.
    url: ${FINCORE_DB_URL:jdbc:postgresql://localhost:5433/fincore}
    username: ${FINCORE_DB_USERNAME:fincore}
    password: ${FINCORE_DB_PASSWORD:fincore_local_dev}

  # --- JPA / Hibernate ---
  jpa:
    # `validate` : Hibernate ne crée JAMAIS le schéma, il le vérifie
    # seulement. C'est Flyway qui est le seul propriétaire du schéma
    # (équivalent strict de `doctrine.schemas` + validate en Symfony).
    hibernate:
      ddl-auto: validate
    # Pas de Open Session In View : on ne veut pas de requête lazy
    # cachée dans un contrôleur (mauvaise pratique en API REST).
    open-in-view: false
    properties:
      # Ne pas logger les mots de passe ou les données sensibles
      hibernate.format_sql: false

  # --- Flyway : migrations versionnées (V1__..., V2__...) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    # En dev on autorise un baseline pour une base existante ;
    # en prod, toute divergence = erreur au démarrage.
    baseline-on-migrate: false

  # --- Jackson (JSON) ---
  # Piège Boot 4 : Jackson 3 (package tools.jackson) a supprimé
  # WRITE_DATES_AS_TIMESTAMPS — les dates sont toujours en ISO-8601
  # par défaut. Configurer `spring.jackson.serialization.*` lèverait
  # une erreur de liaison d'enum.
  jackson:
    # Les champs null sont omis dans les réponses API (équivalent
    # SKIP_NULL en Symfony Serializer)
    default-property-inclusion: non_null

  mvc:
    # Les erreurs standard de Spring MVC (404, 405, 400…) deviennent des
    # corps RFC 9457 automatiquement — GlobalExceptionHandler complète
    # le tableau avec les codes métier.
    problemdetails:
      enabled: true

# =====================================================================
# Paramètres FinCore (hors Spring) — phase 2 : authentification F-01
# =====================================================================
fincore:
  security:
    # Secret de signature HS256 (RG-AUTH-06) : ≥ 256 bits = 32 octets.
    # Lu par JETEUR (JwtService) et VÉRIFICATEUR (JwtDecoder) — une seule
    # propriété, donc une seule source de vérité pour la clé.
    # AUCUNE valeur de repli en dur (règle §2.3 « secrets hors code ») :
    # la clé vit dans `.env` local (non poussé) ou dans les variables
    # d'environnement de production. Sans elle → échec net au démarrage.
    jwt-secret: ${FINCORE_JWT_SECRET}
    access-ttl-minutes: 15 # RG-AUTH-03 : access token 15 min
    refresh-ttl-days: 7 # RG-AUTH-03 : refresh token 7 jours
    max-failed-attempts: 5 # RG-AUTH-05 : verrouillage après 5 échecs
    lock-minutes: 15 # RG-AUTH-05 : verrou de 15 minutes

# =====================================================================
# Actuator — santé et métriques
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true # liveness / readiness pour Docker HEALTHCHECK
      show-details: never # ne jamais exposer les détails en prod

# =====================================================================
# Logs — communs à tous les profils
# =====================================================================
logging:
  pattern:
    # correlationId injecté dans le MDC par CorrelationIdFilter : chaque
    # ligne de log porte l'identifiant renvoyé au client dans les erreurs
    # (« traceId ») → une plainte client = une recherche dans les logs.
    correlation: "%X{correlationId:-} "
  level:
    root: INFO
    com.wince.fincore: DEBUG
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    baseline-on-migrate: false

# Swagger UI accessible sans authentification en dev
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# =====================================================================
# Profil TEST — utilisé par @SpringBootTest (Testcontainers fournit la base)
# ====================================================================
---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.wince.fincore: INFO

# =====================================================================
# Profil PROD — logs compacts, détails de santé masqués (§12.3)
# ====================================================================
---
spring:
  config:
    activate:
      on-profile: prod

# Swagger désactivé en production (§12.3) : le contrat n'est pas public.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# En prod, AUCUNE valeur de repli : si FINCORE_JWT_SECRET n'est pas défini,
# le placeholder explose au démarrage — on préfère refuser de servir plutôt
# que de signer les jetons sans clé (ou avec une clé laissée en clair).
fincore:
  security:
    jwt-secret: ${FINCORE_JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wince.fincore: INFO
